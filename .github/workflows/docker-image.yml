name: docker-worklflow

on:
  push:
    branches:
      - main

jobs:

  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
  
    - name: Log into Azure
      uses: azure/login@v1
      with:
        creds: ${{ secrets.AZ_CREDENTIALS }}
    - name: "Log in to Azure Container Registry"
      uses: azure/docker-login@v1
      with:
        login-server: ${{ secrets.AZR_LOGIN_SERVER }}
        username: ${{ secrets.AZR_USERNAME }}
        password: ${{ secrets.AZR_PASSWORD }}
    - name: "Build and Push Container Image"
      run: |
        docker build -f ./MunsonPickles.Api/Dockerfile -t ${{ secrets.AZR_LOGIN_SERVER }}/munsonpickles/munsonpickles.api:latest .
        docker push ${{ secrets.AZR_LOGIN_SERVER }}/munsonpickles/munsonpickles.api:latest
