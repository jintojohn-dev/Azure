name: docker-worklflow

on:
  push:
    branches:
      - main

jobs:

  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
  
    - name: Log into Azure
      uses: azure/login@v1
      with:
        creds: ${{ secrets.AZ_CREDENTIALS }}
    - name: "Log in to Azure Container Registry"
      uses: azure/docker-login@v1
      with:
        login-server: ${{ secrets.AZR_LOGIN_SERVER }}
        username: ${{ secrets.AZR_USERNAME }}
        password: ${{ secrets.AZR_PASSWORD }}
    - name: Build Docker Image
      run: |
        docker build -f MunsonPickles/MunsonPickles.Api/Dockerfile -t ${{ secrets.AZR_LOGIN_SERVER }}/munsonpickles/munsonpickles.api:latest MunsonPickles/

    - name: Push Docker Image
      run: |
        docker push ${{ secrets.AZR_LOGIN_SERVER }}/munsonpickles/munsonpickles.api:latest

    - name: Configure Web App to Pull Docker Image from ACR
      run: |
        az webapp config container set \
          --name ${{ secrets.WEB_APP_NAME }} \
          --resource-group ${{ secrets.RESOURCE_GROUP }} \
          --container-image-name "${{ secrets.AZR_LOGIN_SERVER }}/munsonpickles/munsonpickles.api:latest" \
          --container-registry-url "https://${{ secrets.AZR_LOGIN_SERVER }}" \
          --container-registry-user ${{ secrets.AZR_USERNAME }} \
          --container-registry-password ${{ secrets.AZR_PASSWORD }}

    - name: Restart Web App
      run: |
        az webapp restart \
          --name ${{ secrets.WEB_APP_NAME }} \
          --resource-group ${{ secrets.RESOURCE_GROUP }}

