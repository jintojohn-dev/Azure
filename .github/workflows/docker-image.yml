name: docker-workflow

on:
  push:
    branches:
      - main
    paths:
      - "Excuses.WebApi/**"
      - "Excuses.Persistence.Shared/**"
      - "Excuses. Persistence.EFCore/**"
      - "*.sln"

env:
  ACR_LOGIN_SERVER: ${{ secrets.ACR_LOGIN_SERVER }}
  RESOURCE_GROUP: rg-excuses
  WEB_APP_NAME: MunsonPicklesApp
  IMAGE_NAME: neurothrone/excuses-webapi

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
  
      - name: Log in to Azure
        uses: azure/login@v1
        with: 
          creds: ${{ secrets. AZURE_CREDENTIALS }}

      - name: Log in to Azure Container Registry
        uses: azure/docker-login@v1
        with:
          login-server:  ${{ secrets.ACR_LOGIN_SERVER }}
          username: ${{ secrets. ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and Push Container Image
        run:  |
          docker build -f ./Excuses.WebApi/Dockerfile \
            -t ${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:latest \
            -t ${{ env.ACR_LOGIN_SERVER }}/${{ env. IMAGE_NAME }}:${{ github.sha }} . 
          docker push ${{ env. ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}: latest
          docker push ${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Configure Web App to use new container image
        run: |
          az webapp config container set \
            --name ${{ env.WEB_APP_NAME }} \
            --resource-group ${{ env. RESOURCE_GROUP }} \
            --container-image-name ${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ github.sha }} \
            --container-registry-url https://${{ env.ACR_LOGIN_SERVER }} \
            --container-registry-user ${{ secrets.ACR_USERNAME }} \
            --container-registry-password ${{ secrets.ACR_PASSWORD }}

      - name: Restart Web App
        run: |
          az webapp restart \
            --name ${{ env.WEB_APP_NAME }} \
            --resource-group ${{ env.RESOURCE_GROUP }}

      - name:  Wait for deployment
        run: sleep 30

      - name: Check Web App status
        run: |
          az webapp show \
            --name ${{ env.WEB_APP_NAME }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --query state -o tsv